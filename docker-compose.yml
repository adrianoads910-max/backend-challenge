name: wagering

x-app: &app
  build: .
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &app-env
    DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    SQS_ENDPOINT: http://ministack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    LOG_LEVEL: info
  depends_on:
    postgres: { condition: service_healthy }
    ministack: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    command: ["postgres", "-c", "max_connections=300"]
    ports: ["5442:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30
      # crash recovery (WAL redo) after an unclean host shutdown can take minutes
      start_period: 180s

  ministack:
    image: ministackorg/ministack:latest
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:4566/')\" || wget -qO- http://localhost:4566/ >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["bun", "src/migrate.ts", "up"]
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # Three identical instances: every one serves HTTP, consumes the queue, relays the outbox
  # and resolves pending references. Correctness never depends on how many run.
  app-1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-1 }
    ports: ["3101:3000"]
  app-2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-2 }
    ports: ["3102:3000"]
  app-3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_ID: app-3 }
    ports: ["3103:3000"]

volumes:
  pgdata:
